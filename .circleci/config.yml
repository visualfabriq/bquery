version: 2
jobs:
  build3:
    executor: codeartifact/default
    docker:
      - image: cimg/python:3.11
        user: root

    working_directory: ~/bquery
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            ~/venv/bin/pip install .[test]
#      - run:
#          name: Install Module
#          command: python setup.py build_ext --inplace && sudo python setup.py install
      - run:
          name: Run Tests
          command: pytest -vs bquery/tests/

workflows:
  version: 2
  build-and-test:
    jobs:
      - build3

  daily:
    triggers:
      - schedule:
          cron: "0 10 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build3
